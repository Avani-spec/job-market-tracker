[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.1.0"
description = "Scrape public job postings, extract skills with NLTK, and track demand over time"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31", "beautifulsoup4>=4.12", "nltk>=3.8", "pyyaml>=6",
  "python-dateutil>=2.8", "sqlalchemy>=2.0", "pandas>=2.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7"]

[project.scripts]
jobtracker = "jobtracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobtracker = ["skills.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
